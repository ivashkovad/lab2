<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Телефонная база данных</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>
</head>
<body>
<header>
  <h1>Управление базой клиентов</h1>
  <img src="https://cdn-icons-png.flaticon.com/512/3059/3059518.png" alt="Logo" class="logo">
</header>

<main>
  <section class="input-section">
    <h3>Регистрация клиента</h3>
    <form id="clientForm">
      <input type="number" id="clientId" placeholder="ID клиента" required>
      <input type="text" id="clientFio" placeholder="ФИО" required>
      <input type="tel" id="clientPhone" placeholder="Номер телефона" required>
      <input type="text" id="clientAddress" placeholder="Адрес">
      <input type="number" id="clientBalance" placeholder="Сумма на счету" step="0.01">

      <div class="controls">
        <button type="button" id="btnAdd">Ввести данные</button>
        <button type="button" id="btnClear">Очистить форму</button>
      </div>
    </form>

    <hr>

    <div class="search-box">
      <label for="idSelector">Выберите ID:</label>
      <select id="idSelector">
        <option value="">-- ID не выбран --</option>
      </select>
      <div class="action-buttons">
        <button type="button" id="btnDelete">Удалить по ID</button>
        <button type="button" id="btnShowAll">Показать все</button>
        <button type="button" id="btnShowOne">Показать элемент по ID</button>
      </div>
    </div>
  </section>

  <section id="outputContainer" class="output-section">
  </section>
</main>

<script src="js/template.js"></script>
<script src="js/model.js"></script>
<script src="js/view.js"></script>
<script src="js/index.js"></script>
</body>
</html>
